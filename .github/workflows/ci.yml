name: Pipeline regression tests
on:
  pull_request:
  push:
    paths: ['scripts/**', 'tests/**', 'config/**', '.github/workflows/**', 'requirements-render.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          python scripts/pipeline.py --self-test
          python scripts/distribute.py --selftest
          python scripts/distribute.py
      - name: Parse every workflow and validate triggers
        run: |
          python - <<'PY'
          import pathlib, yaml
          for path in pathlib.Path('.github/workflows').glob('*.yml'):
              data = yaml.load(path.read_text(), Loader=yaml.BaseLoader)
              assert data.get('on') and data.get('jobs'), path
          data = yaml.load(pathlib.Path('.github/workflows/tiktok.yml').read_text(), Loader=yaml.BaseLoader)
          assert 'schedule' in data['on'] and 'workflow_dispatch' in data['on']
          assert data['concurrency']['cancel-in-progress'] == 'false'
          PY

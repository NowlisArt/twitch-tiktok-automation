name: Novel Novel connection check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/novel-connection-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BUFFER_API_KEY_NOVEL: ${{ secrets.BUFFER_API_KEY_NOVEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Novel Novel only (no posts)
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import buffer_publish as b
          account = next(a for a in b.ACCOUNTS if a['id'] == 'novel')
          org = b.verify_channel(account)
          b.contract_check(account)
          print('Novel Novel queue readable:', len(b.fetch_posts(org, account)))
          PY

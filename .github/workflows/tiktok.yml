name: Twitch Clip - Safe Self-Test

on:
  push:
    paths:
      - .github/workflows/tiktok.yml
      - scripts/pipeline.py
  workflow_dispatch:
    inputs:
      mode:
        description: "Testmodus: selftest oder diagnose (nur lesen, kein Upload)"
        type: choice
        required: true
        default: selftest
        options:
          - selftest
          - diagnose

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python-Syntax pruefen
        run: python -m py_compile scripts/pipeline.py

      - name: Pipeline-Selbsttest
        run: python scripts/pipeline.py --self-test

      - name: Twitch-Diagnose-Abhaengigkeit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose' }}
        run: python -m pip install --upgrade yt-dlp

      - name: Twitch-Clip-Quellen pruefen (nur lesen, kein Upload)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose' }}
        run: python scripts/pipeline.py --diagnose

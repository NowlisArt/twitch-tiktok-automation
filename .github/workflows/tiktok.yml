# NowlisArt/twitch-tiktok-automation
# Twitch clip research and editing only. TikTok publishing is handled separately by Metricool.
name: Twitch Auto20 | NowlisArt

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tiktok.yml
      - scripts/pipeline.py
      - config/approved_channels.txt
  workflow_dispatch:
    inputs:
      mode:
        description: 'Select a safe test, QA render, or prepare approved clips'
        required: true
        default: selftest
        type: choice
        options:
          - selftest
          - diagnose
          - render-test
          - prepare
  schedule:
    # Hourly, all year. Python respects the 09:00-22:59 UTC production window
    # and the daily/monthly limits configured in scripts/pipeline.py.
    - cron: '19 * * * *'

permissions:
  contents: read

concurrency:
  group: twitch-nowlisart-main
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ github.repository == 'NowlisArt/twitch-tiktok-automation' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax pruefen
        run: python -m py_compile scripts/pipeline.py
      - name: Pipeline-Selbsttest
        run: python scripts/pipeline.py --self-test

  diagnose:
    needs: checks
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Twitch-Diagnose vorbereiten
        run: python -m pip install --upgrade yt-dlp
      - name: Clip-URLs und Original-Metadaten pruefen
        run: python scripts/pipeline.py --diagnose

  render_test:
    needs: checks
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'render-test') || (github.event_name == 'push' && github.event.head_commit.message == 'Run QA render via push (no posting)') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Video-Tools installieren
        run: |
          python -m pip install --upgrade yt-dlp 'faster-whisper==1.2.1' 'av>=11,<19' 'opencv-python-headless==4.11.0.86'
          python -m pip check
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Frischen Clip suchen und als Testvideo schneiden
        env:
          MIN_VIEWS: '800'
        run: python scripts/pipeline.py --render-test
      - name: Private Testdateien zur Sichtpruefung sichern
        uses: actions/upload-artifact@v4
        with:
          name: twitch-video-qa
          path: |
            rendered/tiktok.mp4
            rendered/cover.jpg
            rendered/subs.ass
            rendered/test_manifest.json
          if-no-files-found: error
          retention-days: 7

  prepare:
    needs: checks
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - name: Repository laden und Verlauf fuer Duplikatsperre behalten
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clip- und Video-Tools installieren
        run: |
          python -m pip install --upgrade yt-dlp 'faster-whisper==1.2.1' 'av>=11,<19' 'opencv-python-headless==4.11.0.86'
          python -m pip check
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Frische Clips finden, Ersatzclips versuchen und MP4s vorbereiten
        env:
          ENABLE_PREPARATION: 'true'
          MIN_VIEWS: '800'
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pipeline.py
      - name: Verarbeitete IDs und Fehlversuche dauerhaft speichern
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f state/auto20.json ]; then
            echo "No state file was created; nothing to persist."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/auto20.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist clip IDs and retry backoff [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Sicherheitsstatus anzeigen
        if: ${{ always() }}
        run: |
          echo '## NowlisArt clip preparation' >> "$GITHUB_STEP_SUMMARY"
          echo 'Rendered videos are QA candidates, not verified TikTok posts.' >> "$GITHUB_STEP_SUMMARY"
          echo 'TikTok autopublishing via Metricool is NOT enabled by this workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Watchlist: 50 seed channels; no automatic TwitchTracker ranking sync.' >> "$GITHUB_STEP_SUMMARY"
          echo 'State: state/auto20.json (if created)' >> "$GITHUB_STEP_SUMMARY"

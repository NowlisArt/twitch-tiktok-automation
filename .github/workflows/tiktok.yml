# NowlisArt/twitch-tiktok-automation
# Adapted from the supplied Twitch Auto20 GitHub Actions workflow.
# This file uses this repository's scripts/pipeline.py instead of embedding
# another obsolete 400+ line copy of the Python pipeline.
# This workflow prepares videos only. It does not publish TikTok posts.
name: Twitch Auto20 | NowlisArt

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tiktok.yml
      - scripts/pipeline.py
      - config/approved_channels.txt
      - config/rejected_clips.txt
  workflow_dispatch:
    inputs:
      mode:
        description: "Run a test, render a QA video, or prepare candidates"
        required: true
        type: choice
        default: selftest
        options:
          - selftest
          - diagnose
          - render-test
          - prepare
  schedule:
    # Avoid top-of-hour congestion. Scheduled runs are best-effort.
    # The Python script additionally enforces a UTC production window.
    - cron: '43 * * * *'
    # Backup trigger for GitHub schedule delays/dropped events; concurrency and caps remain enforced.
    - cron: '17 * * * *'
    # Additional staggered safety nets for GitHub's best-effort scheduler.
    # Existing concurrency and state-based caps prevent parallel preparation.
    - cron: '7 * * * *'
    - cron: '31 * * * *'

permissions:
  contents: read

concurrency:
  group: twitch-auto20-nowlisart-main
  cancel-in-progress: false

jobs:
  checks:
    name: Check Python pipeline
    if: ${{ github.repository == 'NowlisArt/twitch-tiktok-automation' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python-Syntax pruefen
        run: python -m py_compile scripts/pipeline.py
      - name: Pipeline-Selbsttest
        run: python scripts/pipeline.py --self-test
      - name: Accountuebergreifende Freigabe und Duplikate testen
        run: |
          python -m py_compile scripts/distribute.py
          python scripts/distribute.py --selftest
          python scripts/distribute.py
      - name: Betriebsbereitschaft kontrollieren
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.distribute import eligible
          state=json.loads(Path('state/auto20.json').read_text(encoding='utf-8'))
          clips=state.get('created', [])
          approved=[c for c in clips if eligible(c,85)]
          print(f'READINESS: {len(clips)} prepared, {len(approved)} editorially approved')
          if not approved:
              print('NOT READY TO POST: no independently approved clips; fail closed.')
          print('Posting remains disabled until a verified Buffer publisher exists.')
          PY

  diagnose:
    name: Twitch-Verbindung pruefen (keine Downloads)
    needs: checks
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: yt-dlp installieren
        run: python -m pip install --upgrade yt-dlp
      - name: Original-Links und Metadaten pruefen
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python scripts/pipeline.py --diagnose

  render_test:
    name: Ein 9:16-Testvideo erstellen (keine Veroeffentlichung)
    needs: checks
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'render-test') || (github.event_name == 'push' && github.event.head_commit.message == 'Run QA render via push (no posting)') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clip-Tools installieren
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade yt-dlp 'faster-whisper==1.2.1' 'av>=11,<19' 'opencv-python-headless==4.11.0.86'
          python -m pip check
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Clip suchen, Ersatz versuchen und schneiden
        env:
          MIN_VIEWS: '800'
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          QA_SAMPLE_COUNT: '3'
          ASR_MODEL: 'medium'
          PYTHONUNBUFFERED: '1'
        run: python scripts/pipeline.py --render-test
      - name: Video und Untertitel als privates Testartefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: twitch-video-qa
          path: |
            rendered/tiktok.mp4
            rendered/cover.jpg
            rendered/subs.ass
            rendered/test_manifest.json
            rendered/qa_samples/**
          if-no-files-found: error
          retention-days: 7

  prepare:
    name: Automatische Clip-Vorbereitung (KEIN TikTok-Upload)
    needs: checks
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare') || (github.event_name == 'push' && github.event.head_commit.message == 'Run automated clip preparation smoke test') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      MIN_VIEWS: '800'
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      ASR_MODEL: 'medium'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clip-Tools installieren
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade yt-dlp 'faster-whisper==1.2.1' 'av>=11,<19' 'opencv-python-headless==4.11.0.86'
          python -m pip check
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Frische Twitch-Clips pruefen, Ersatzclips schneiden und GitHub Release erstellen
        env:
          ENABLE_PREPARATION: 'true'
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pipeline.py
      - name: Verarbeitete Clips und Fehlversuche gegen Duplikate speichern
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f state/auto20.json ]; then
            echo 'Keine neue Queue-Datei vorhanden.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/auto20.json
          if ! git diff --cached --quiet; then
            git commit -m 'Auto20: Zustand und Duplikatsperre aktualisieren [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Produktionsstatus anzeigen
        if: ${{ always() }}
        shell: bash
        run: |
          echo '## Twitch Auto20 | NowlisArt' >> "$GITHUB_STEP_SUMMARY"
          echo 'Prepared candidates are not quality-approved or posted to TikTok.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Watchlist: 50 static channels, not a live TwitchTracker ranking.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Queue: state/auto20.json (if generated)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Metricool/TikTok posting is deliberately separate.' >> "$GITHUB_STEP_SUMMARY"


name: Twitch Clip - Safe Self-Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python-Syntax pruefen
        run: python -m py_compile scripts/pipeline.py

      - name: Pipeline-Selbsttest
        run: python scripts/pipeline.py --self-test

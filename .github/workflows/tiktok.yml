name: Twitch to Dream Void and Sunshine | GitHub starter

on:
  schedule:
    - cron: '17 7,10,13,16,19,22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight: read-only Buffer; run: complete pipeline; prepare: private QA; diagnose: Twitch only'
        type: choice
        default: preflight
        options: [preflight, run, prepare, diagnose]
        required: true
  push:
    branches: [main]
    paths: ['config/reviews.json', 'config/rights.json']

permissions:
  contents: read

concurrency:
  group: twitch-auto20-nowlisart-main
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.repository == 'NowlisArt/twitch-tiktok-automation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      actions: read
    env:
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      ASR_MODEL: medium
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression checks
        run: |
          python -m unittest discover -s tests -v
          python scripts/pipeline.py --self-test
          python scripts/distribute.py --selftest
      - name: Live Buffer preflight (no posts)
        if: inputs.mode == 'preflight'
        run: python scripts/buffer_publish.py --preflight
      - name: Install render tools
        if: inputs.mode != 'preflight'
        run: |
          python -m pip install -r requirements-render.txt
          python -m pip check
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Cache speech model
        if: inputs.mode != 'preflight' && inputs.mode != 'diagnose'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-medium-v1
      - name: Twitch metadata diagnosis (no media download)
        if: inputs.mode == 'diagnose'
        run: python scripts/pipeline.py --diagnose
      - name: Promote exact reviewed and authorized artifacts
        if: inputs.mode != 'preflight' && inputs.mode != 'diagnose'
        run: python scripts/review_release.py
      - name: Discover and render private QA candidates
        if: github.event_name == 'schedule' || inputs.mode == 'run' || inputs.mode == 'prepare'
        env:
          ENABLE_PREPARATION: 'true'
        run: python scripts/pipeline.py
      - name: Reconcile and schedule eligible clips for Dream Void and Sunshine
        if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.mode == 'run'
        env:
          ENABLE_BUFFER_POSTING: 'true'
        run: python scripts/buffer_publish.py
      - name: Save state even after failure
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/auto20.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist pipeline state [skip ci]'
            git push origin HEAD:main
          fi
      - name: Preserve exact QA files and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twitch-video-qa
          path: |
            rendered/qa_samples/**
            rendered/buffer-report.json
            state/auto20.json
          if-no-files-found: error
          retention-days: 7
      - name: Outcome summary
        if: always()
        run: python scripts/status.py

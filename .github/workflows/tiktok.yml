name: Twitch Auto - Safety Checks and Clip Preparation

on:
  push:
    paths:
      - .github/workflows/tiktok.yml
      - scripts/pipeline.py
  workflow_dispatch:
    inputs:
      mode:
        description: "Selftest, diagnostic or one private QA render; never TikTok posts."
        type: choice
        required: true
        default: selftest
        options:
          - selftest
          - diagnose
          - render-test
  schedule:
    - cron: '17 9-22 * * *'

permissions:
  contents: write

concurrency:
  group: twitch-clip-pipeline
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python Syntax
        run: python -m py_compile scripts/pipeline.py

      - name: Pipeline Unit Selftest
        run: python scripts/pipeline.py --self-test

      - name: Dependencies for Diagnostics
        if: ${{ github.event_name == 'push' || inputs.mode == 'diagnose' || github.event_name == 'schedule' }}
        run: python -m pip install --upgrade yt-dlp

      - name: Source Diagnostic (nonpublishing)
        if: ${{ github.event_name == 'push' || inputs.mode == 'diagnose' }}
        run: python scripts/pipeline.py --diagnose

      - name: Dependencies for Rendering
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'render-test' || github.event.head_commit.message == 'Run sample video rendering test' }}
        run: |
          python -m pip install --upgrade yt-dlp 'faster-whisper==1.2.1' 'av>=11,<19' 'opencv-python-headless==4.11.0.86'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Dry-run Render (no public upload)
        if: ${{ inputs.mode == 'render-test' || github.event.head_commit.message == 'Run sample video rendering test' }}
        run: python scripts/pipeline.py --render-test

      - name: Save QA Video as private Actions artifact
        if: ${{ inputs.mode == 'render-test' || github.event.head_commit.message == 'Run sample video rendering test' }}
        uses: actions/upload-artifact@v4
        with:
          name: twitch-video-qa
          path: |
            rendered/tiktok.mp4
            rendered/cover.jpg
            rendered/subs.ass
            rendered/test_manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Hourly automated MP4 preparation (NO TikTok posting)
        if: ${{ github.event_name == 'schedule' }}
        env:
          ENABLE_PREPARATION: 'true'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_VIEWS: '800'
        run: python scripts/pipeline.py

      - name: Persist clip IDs and failure backoff
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ -f state/auto20.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state/auto20.json
            if ! git diff --cached --quiet; then
              git commit -m 'Save prepared clips and prevent duplicates'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

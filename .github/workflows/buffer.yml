# Independent Buffer integration: SAFE BY DEFAULT. No createPost mutation.
# Production posting requires a separate, tested and explicitly enabled release.
name: Buffer | German Twitch Quality & Connection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = local checks; connection = read-only Buffer API"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - connection
  schedule:
    - cron: '35 11,12,15,16 * * *'
  push:
    paths:
      - .github/workflows/buffer.yml
      - scripts/distribute.py
      - scripts/buffer_publish.py
      - config/distribution.json

permissions:
  contents: write

concurrency:
  group: buffer-dreamvoid26-quality
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate / no publication
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BUFFER_CHANNEL_ID: "6ad6c095778b240e2f624d3b"
      BUFFER_EXPECTED_HANDLE: "dreamvoid26"
      QUALITY_THRESHOLD: "85"
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
      - name: Read-only clip audit and schedule preview
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from urllib.parse import urlparse
          from collections import Counter

          threshold = int(__import__('os').environ['QUALITY_THRESHOLD'])
          assert threshold == 85
          state = json.loads(Path('state/auto20.json').read_text(encoding='utf-8'))
          items = state.get('created', [])
          assert isinstance(items, list)
          local = datetime.now(ZoneInfo('Europe/Berlin'))
          print('READ ONLY: no Buffer post is created or scheduled.')
          print('Goal: 2 daily slots, 14:00 and 18:00 Europe/Berlin, seven days a week.')
          print('Existing Buffer slots must be checked before enabling automatic scheduling.')
          for hour in (14, 18):
              upcoming = local.replace(hour=hour, minute=0, second=0, microsecond=0)
              if upcoming <= local:
                  upcoming += timedelta(days=1)
              print('Next intended local slot:', upcoming.isoformat())

          def iso_date(value):
              try:
                  return datetime.fromisoformat(str(value).replace('Z','+00:00')).astimezone(timezone.utc)
              except (ValueError, TypeError):
                  return None

          def audit(clip):
              reasons = []
              cid = str(clip.get('clip_id') or clip.get('clip_slug') or '')
              if not cid: reasons.append('missing source clip ID')
              url = str(clip.get('video_url') or '')
              parsed = urlparse(url)
              if not (parsed.scheme == 'https' and parsed.hostname == 'github.com' and parsed.path.endswith('.mp4')):
                  reasons.append('video URL not a trusted GitHub MP4 path')
              original = iso_date(clip.get('original_created_at'))
              age = (datetime.now(timezone.utc) - original).total_seconds()/3600 if original else None
              if age is None or not 0 <= age <= 336:
                  reasons.append('original outside verified 14-day window')
              views = clip.get('views_at_selection')
              minimum_views = 800 if age is not None and age <= 24 else 600 if age is not None and age <= 48 else 400 if age is not None and age <= 72 else 250
              if type(views) is not int or views < minimum_views:
                  reasons.append('original view count below age-adjusted discovery threshold')
              if clip.get('subtitle_verified') is not True:
                  reasons.append('subtitle accuracy not verified')
              if clip.get('technical_qa_passed') is not True:
                  reasons.append('video/audio/crop quality not independently checked')
              if clip.get('rights_status') != 'verified_permission':
                  reasons.append('permission not independently confirmed')
              if clip.get('editorial_review_status') != 'approved':
                  reasons.append('German-language hook, story, context and tone not editorially approved')
              if clip.get('quality_score_verified') is not True:
                  reasons.append('quality score lacks verification')
              score = clip.get('quality_score')
              if type(score) is not int or not 0 <= score <= 100 or score < threshold:
                  reasons.append('verified quality score below 85 or missing')
              if clip.get('buffer_post_id'):
                  reasons.append('already queued to Buffer')
              if clip.get('posted_to_tiktok') or str(clip.get('status','')).startswith('metricool_'):
                  reasons.append('already used in Metricool/TikTok')
              return reasons

          counts = Counter(str(c.get('clip_id') or c.get('clip_slug') or '') for c in items)
          eligible = 0
          for c in items[-30:]:
              issues = audit(c)
              cid = str(c.get('clip_id') or c.get('clip_slug') or '')
              if cid and counts[cid] > 1:
                  issues.append('duplicate ID in existing queue')
              eligible += not issues
              print(json.dumps({'clip_id': cid, 'eligible': not issues, 'reasons': issues}, ensure_ascii=False))
          assert audit({}), 'empty candidate must fail closed'
          # Regression tests: popularity and metadata alone never imply editorial quality.
          sample = {
              'clip_id': 'unique-test-id',
              'video_url': 'https://github.com/NowlisArt/twitch-tiktok-automation/releases/download/test/example.mp4',
              'original_created_at': datetime.now(timezone.utc).isoformat(),
              'views_at_selection': 12000,
              'subtitle_verified': True,
              'technical_qa_passed': True,
              'rights_status': 'verified_permission',
              'editorial_review_status': 'approved',
              'quality_score_verified': True,
              'quality_score': 90,
          }
          assert not audit(sample), 'fully verified sample should pass'
          assert 'quality score' in ' '.join(audit(dict(sample, quality_score=84)))
          assert 'subtitle' in ' '.join(audit(dict(sample, subtitle_verified=False)))
          assert 'Metricool' in ' '.join(audit(dict(sample, posted_to_tiktok=True)))
          assert 'Buffer' in ' '.join(audit(dict(sample, buffer_post_id='post-1')))
          assert 'permission' in ' '.join(audit(dict(sample, rights_status='user_asserted_not_independently_verified')))
          assert 'editorial' in ' '.join(audit(dict(sample, editorial_review_status='not_reviewed')))
          assert 'score' in ' '.join(audit(dict(sample, quality_score_verified=False)))
          print('REGRESSION PASS: quality, subtitle, duplicate, permission, editorial checks')
          print(f'AUDIT PASS: {min(len(items),30)} candidates inspected; {eligible} eligible. No uploads.')
          PY
      - name: Test shared multi-account distribution and preview
        shell: bash
        run: |
          python scripts/distribute.py --selftest
          python scripts/distribute.py
      - name: Read-only Buffer account and channel verification
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'connection') }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          key = os.environ.get('BUFFER_API_KEY','')
          if not key:
              sys.exit('BUFFER_API_KEY is not set in GitHub secrets')
          def gql(query):
              req=urllib.request.Request('https://api.buffer.com',
                  data=json.dumps({'query':query}).encode(),
                  headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'},
                  method='POST')
              with urllib.request.urlopen(req, timeout=25) as resp:
                  result=json.load(resp)
              if result.get('errors'):
                  raise RuntimeError('Buffer GraphQL returned errors: '+str([e.get('message') for e in result['errors']]))
              return result.get('data') or {}
          account=gql('query { account { organizations { id name } } }')
          organizations=(account.get('account') or {}).get('organizations') or []
          target=os.environ['BUFFER_CHANNEL_ID']
          expected=os.environ['BUFFER_EXPECTED_HANDLE'].lower().lstrip('@')
          matched=False
          for org in organizations:
              org_id=json.dumps(org['id'])
              channels=gql('query { channels(input: { organizationId: '+org_id+' }) { id name service } }').get('channels') or []
              for c in channels:
                  if c.get('id') != target: continue
                  name=str(c.get('name','')).lower().lstrip('@')
                  service=str(c.get('service','')).lower()
                  print('Target channel found; service:',service,'; handle:',name)
                  if name != expected or service != 'tiktok':
                      sys.exit('STOP: Buffer channel does not match expected TikTok @dreamvoid26')
                  matched=True
          if not matched:
              sys.exit('STOP: expected Buffer channel ID not accessible; no posts created')
          print('PASS: read-only Buffer authentication and exact channel match.')
          try:
              schema=gql('query { __schema { mutationType { fields { name } } } }')
              fields=((schema.get('__schema') or {}).get('mutationType') or {}).get('fields') or []
              print('BUFFER PUBLISHING MUTATIONS AVAILABLE (NOT EXECUTED):', json.dumps([f['name'] for f in fields if 'post' in f['name'].lower()]))
          except Exception as exc:
              print('Buffer schema discovery unavailable:', type(exc).__name__, str(exc)[:200])
          PY

      - name: Verify Buffer posting API contract without creating a post
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          key=os.environ.get('BUFFER_API_KEY')
          if not key:
              raise SystemExit('FAIL: missing BUFFER_API_KEY')
          def gql(query):
              req=urllib.request.Request('https://api.buffer.com',
                  data=json.dumps({'query':query}).encode(),
                  headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as resp:
                  result=json.load(resp)
              if result.get('errors'):
                  raise RuntimeError('GraphQL introspection rejected: '+str(result['errors']))
              return result['data']
          data=gql('query { __schema { mutationType { fields { name args { name type { kind name ofType { kind name } } } } } } }')
          mutations=((data.get('__schema') or {}).get('mutationType') or {}).get('fields') or []
          create=next((m for m in mutations if m['name']=='createPost'),None)
          if not create:
              raise SystemExit('FAIL: Buffer createPost mutation unavailable')
          print('PASS: createPost mutation exists; argument names:',[a['name'] for a in create['args']])
          details=gql('query { __type(name:"CreatePostInput") { name inputFields { name type { kind name ofType { kind name } } } } }')
          fields=((details.get('__type') or {}).get('inputFields') or [])
          if not fields:
              raise SystemExit('FAIL: CreatePostInput not available; publisher input must be adapted')
          names={f['name'] for f in fields}
          print('CreatePostInput fields:',sorted(names))
          required={'channelId','text'}
          if not required.issubset(names):
              raise SystemExit('FAIL: publisher expected fields not supported: '+str(required-names))
          print('PASS: Buffer publishing API schema inspected; no post created')
          PY
      - name: Buffer scheduler preflight (no unapproved posts)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          ENABLE_BUFFER_POSTING: 'true'
        run: |
          python -m py_compile scripts/buffer_publish.py
          python scripts/buffer_publish.py
      - name: Reconcile Buffer publication statuses (read only)\n        if: ${{ always() }}\n        env:\n          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}\n        run: |\n          python scripts/buffer_publish.py --reconcile\n      - name: Save scheduling reservation state
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/auto20.json
          if ! git diff --cached --quiet; then
            git commit -m 'Buffer: persist scheduled clip reservation [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
